{% extends "bases/base.html" %}


{% block content %}
    {{ super() }}
    <div class="col-lg-3"></div>
    <div class="col-lg-6">
        <div class="well">
            <h1>TOTP Authentication</h1>
            <h3>Authentication with your device now</h3>
            <form id="totp_login_form" method="post">
                {{ form.csrf_token }}
                {{ form.totp_code(class_="form-control") }}
                <button class="btn btn-primary" type="submit" id="submit" name="submit">
                    Submit
                </button>
            </form>
        </div>
    </div>
    <div class="col-lg-3"></div>
{% endblock %}
