version: "3.8"
services:
  app:
    build:
      context: .
    environment: &env
      APP_NAME: "localhost"
      BASE_URL: "http://localhost"
      DEBUG: "1"
      PROD: "0"
      TESTING: "1"
      MAIL_DEFAULT_SENDER: "admin@ecaz.xyz"
      MAIL_PASSWORD: ""
      MAIL_SERVER: "localhost"
      MAIL_USERNAME: ""
      POSTGRES_DB: "postgres"
      POSTGRES_HOST: "db"
      POSTGRES_PASSWORD: "1234"
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: "disable"
      POSTGRES_USER: "postgres"
      SECRET_KEY: "1234"
      RATE_LIMIT_ENABLED: "0"
      WTF_CSRF_ENABLED: "0"
    entrypoint: "tox ${TOX_ARGS:-}"
    volumes:
      - ./app:/app

  db:
    image: postgres:15.5-bookworm
    environment: *env
    networks:
      default:
        aliases:
          - db